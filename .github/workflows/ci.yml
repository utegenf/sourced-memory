name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -q
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel
      - name: Verify wheel is source-tree only (no research/)
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          bad = [n for n in names if n.startswith("research/") or n.startswith("tests/")]
          if bad:
              print("Wheel contains files it should not:", bad)
              sys.exit(1)
          if not any(n.startswith("sourced_memory/") for n in names):
              print("Wheel is missing sourced_memory package")
              sys.exit(1)
          print(f"OK: wheel contains {len(names)} entries; scope looks correct.")
          PY
      - name: Install wheel in a fresh venv and import
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --upgrade pip
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/python -c "from sourced_memory import Memory, TrustPolicy, LLMRouter, NullRouter, Decider; print('import ok')"
