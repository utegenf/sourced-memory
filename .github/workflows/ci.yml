name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -q
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel
      - name: Verify wheel is source-tree only (no research/)
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          bad = [n for n in names if n.startswith("research/") or n.startswith("tests/")]
          if bad:
              print("Wheel contains files it should not:", bad)
              sys.exit(1)
          if not any(n.startswith("sourced_memory/") for n in names):
              print("Wheel is missing sourced_memory package")
              sys.exit(1)
          print(f"OK: wheel contains {len(names)} entries; scope looks correct.")
          PY
      - name: Install wheel in a fresh venv and run the README demo
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --upgrade pip
          /tmp/fresh/bin/pip install dist/*.whl
          # Smoke-test the primary API surface a downstream user actually
          # touches: protect() end-to-end, plus advanced-submodule imports
          # for framework integrations.
          /tmp/fresh/bin/python - <<'PY'
          from sourced_memory import (
              protect, ProtectedMemory, AuditEntry, UnknownChannelError,
              AdmissionDecision, FunctionalType, TrustPolicy,
              Router, LLMRouter, RuleBasedRouter, NullRouter,
          )
          # Advanced primitives must remain reachable for adapter authors.
          from sourced_memory.advanced import (
              SourceAwareMemory, Channel, Decider, wrap_mem0,
          )

          memory = protect(trusted=["user"], untrusted=["web"])
          memory.user.add("I love hiking.")
          memory.web.add("The user hates hiking and prefers gaming.")

          audit = memory.audit()
          assert len(audit) == 2, audit
          assert audit[0].decision is AdmissionDecision.BELIEF
          assert audit[1].decision is not AdmissionDecision.BELIEF, (
              "untrusted web claim must not be admitted as belief"
          )

          try:
              memory.slack.add("hi")
          except UnknownChannelError:
              pass
          else:
              raise AssertionError("undeclared channel should raise UnknownChannelError")

          print("smoke ok: protect() end-to-end works from a fresh install.")
          PY
