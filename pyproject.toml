[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sourced-memory"
version = "0.1.0a4"
description = "Source-aware admission control for persistent agent memory."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Fatima Otegen" }]
keywords = ["agent-memory", "llm-agents", "provenance", "belief-updating", "memory-poisoning", "source-aware"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.0"]
# Reference adapter for the Mem0 open-source memory layer. Users can also
# duck-type any Mem0-shaped client without installing mem0 itself.
mem0 = ["mem0ai>=0.1"]
# Deps to reproduce the paper's experiments in research/. Not required to use
# the library. See research/README.md.
research = ["anthropic>=0.40", "pydantic>=2.0", "matplotlib>=3.8", "numpy>=1.24"]
dev = ["pytest>=8.0", "build>=1.2"]

[project.urls]
Repository = "https://github.com/utegenf/sourced-memory"
Issues = "https://github.com/utegenf/sourced-memory/issues"

# Wheel contents come from src/sourced_memory only; the research/ tree is a
# reproducibility artifact and is intentionally not shipped in the package.
[tool.setuptools.packages.find]
where = ["src"]
include = ["sourced_memory*"]

# Include the PEP 561 py.typed marker so downstream type-checkers pick up
# our inline type hints without a separate stubs package.
[tool.setuptools.package-data]
sourced_memory = ["py.typed"]
